name: bot-comment
on:
  workflow_dispatch:
    inputs:
      pr:
        required: true
      body:
        required: true
permissions:
  issues: write
  pull-requests: write
jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$BODY"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          BODY: ${{ inputs.body }}
